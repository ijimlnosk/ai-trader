services:
  # On sol-server the live database is ai-trader-db (project ai-trader) using the same volume.
  # Starting this service there too would run two servers on one data directory, so it is opt-in.
  db:
    profiles: ["standalone-db"]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_trader}
      POSTGRES_USER: ${POSTGRES_USER:-ai_trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      BROKER_MODE: ${BROKER_MODE:-paper}
      LIVE_TRADING_ENABLED: ${LIVE_TRADING_ENABLED:-false}
      PAPER_ORDER_EXECUTION_ENABLED: ${PAPER_ORDER_EXECUTION_ENABLED:-false}
      PAPER_LOOP_ENABLED: ${PAPER_LOOP_ENABLED:-false}
      MARKET_DATA_SCHEDULE_ENABLED: ${MARKET_DATA_SCHEDULE_ENABLED:-false}
      PAPER_LOOP_SCHEDULE_ENABLED: ${PAPER_LOOP_SCHEDULE_ENABLED:-false}
      NEWS_SCHEDULE_ENABLED: ${NEWS_SCHEDULE_ENABLED:-false}
      UNIVERSE_PLAN_SCHEDULE_ENABLED: ${UNIVERSE_PLAN_SCHEDULE_ENABLED:-false}
      MOMENTUM_EXECUTION_ENABLED: ${MOMENTUM_EXECUTION_ENABLED:-false}
      MINUTE_BARS_SCHEDULE_ENABLED: ${MINUTE_BARS_SCHEDULE_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NEWS_ANALYSIS_ENABLED: ${NEWS_ANALYSIS_ENABLED:-false}
      NEWS_ANALYSIS_MODEL: ${NEWS_ANALYSIS_MODEL:-claude-opus-5-5}
      AI_DAILY_BUDGET_USD: ${AI_DAILY_BUDGET_USD:-0.5}
      AI_MONTHLY_BUDGET_USD: ${AI_MONTHLY_BUDGET_USD:-6.5}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      NAVER_DAILY_CALL_CAP: ${NAVER_DAILY_CALL_CAP:-1000}
      NAVER_MONTHLY_CALL_CAP: ${NAVER_MONTHLY_CALL_CAP:-20000}
      ORDER_API_TOKEN: ${ORDER_API_TOKEN:-}
      CONSOLE_READ_TOKEN: ${CONSOLE_READ_TOKEN:-}
      TRADING_KILL_SWITCH_ENABLED: ${TRADING_KILL_SWITCH_ENABLED:-false}
      KIS_APP_KEY: ${KIS_APP_KEY:-}
      KIS_APP_SECRET: ${KIS_APP_SECRET:-}
      KIS_BASE_URL: ${KIS_BASE_URL:-https://openapivts.koreainvestment.com:29443}
      KIS_ACCOUNT_NO: ${KIS_ACCOUNT_NO:-}
      KIS_ACCOUNT_PRODUCT_CODE: ${KIS_ACCOUNT_PRODUCT_CODE:-}
    ports:
      - "127.0.0.1:3200:3000"
    depends_on:
      db:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  # Authenticated console; forwards individual sessions, never a machine token.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      CONSOLE_API_URL: http://server:3000
      CONSOLE_PUBLIC_ORIGIN: ${CONSOLE_PUBLIC_ORIGIN:-https://trader.jjinsol.com}
    ports:
      - "127.0.0.1:3201:3000"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  postgres_data:
    external: true
    name: ${POSTGRES_VOLUME_NAME:?Set the existing PostgreSQL volume name}
